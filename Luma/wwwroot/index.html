<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luma — 光线助手</title>
    <base href="/" />

    <!-- MudBlazor -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- Luma 自定义样式 -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="lib/suncalc/suncalc.min.js"></script>
    <script src="js/luma.js"></script>
    <script src="js/blazorCulture.js"></script>
</head>

<body>
    <div id="app">
        <div class="loading-progress">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" />
                <circle cx="50" cy="50" r="40" />
            </svg>
        </div>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        出现了一个错误。<a href="." class="reload">重新加载</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        Blazor.start({
            applicationCulture: blazorCulture.get() || 'en'
        });
    </script>
</body>

</html>
