name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: dotnet publish Luma/Luma.csproj -c Release -o release --nologo

      - name: Fix base path & 404
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          sed -i 's|<base href="/" />|<base href="/Luma/" />|g' release/wwwroot/index.html
          sed -i 's|<base href="/" />|<base href="/Luma/" />|g' release/wwwroot/404.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: release/wwwroot